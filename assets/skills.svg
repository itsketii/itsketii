<svg xmlns="http://www.w3.org/2000/svg" width="800" height="252" viewBox="0 0 800 252" role="img" aria-label="Qualités : curiosité, bonne humeur, persévérance, à fond jusqu'au bout"><title>Qualités : curiosité, bonne humeur, persévérance, à fond jusqu'au bout</title><style>
.lab{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:2px;fill:#c2b0ee}
.lab2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10px;letter-spacing:1.5px;fill:#9885cf}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 7s linear infinite}
@keyframes sw{from{transform:translateY(-70px)}to{transform:translateY(252px)}}
@media (prefers-reduced-motion:reduce){.blink,.sweep{animation:none}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:gr 5s ease-out infinite}@keyframes gr{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.grow{animation:none}}</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="1" fill="#000" fill-opacity=".16"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d946ef" stop-opacity="0"/><stop offset=".5" stop-color="#d946ef" stop-opacity=".10"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></linearGradient>
</defs><clipPath id="k0"><rect x="4" y="4" width="258" height="140" rx="12"/></clipPath>
<rect x="4" y="4" width="258" height="140" rx="12" fill="#2a1658"/>
<g clip-path="url(#k0)"><rect x="4" y="4" width="258" height="140" fill="url(#sl)"/><rect class="sweep" x="4" y="4" width="258" height="70" fill="url(#sg)"/></g>
<rect x="4.5" y="4.5" width="257" height="139" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><g transform="translate(26,24)"><circle cx="11" cy="11" r="8" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 L25 25" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text class="lab" x="64" y="43" style="letter-spacing:1.5px">CURIOSITÉ</text><text class="s" x="26" y="82" font-size="12.5" fill="#c2b0ee">Je pose des questions et je</text><text class="s" x="26" y="101" font-size="12.5" fill="#c2b0ee">creuse jusqu'à comprendre.</text><clipPath id="k1"><rect x="270" y="4" width="258" height="140" rx="12"/></clipPath>
<rect x="270" y="4" width="258" height="140" rx="12" fill="#2a1658"/>
<g clip-path="url(#k1)"><rect x="270" y="4" width="258" height="140" fill="url(#sl)"/><rect class="sweep" x="270" y="4" width="258" height="70" fill="url(#sg)"/></g>
<rect x="270.5" y="4.5" width="257" height="139" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><g transform="translate(292,24)"><circle cx="14" cy="14" r="12" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 17 Q14 23 19 17" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 10 V11 M18 10 V11" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text class="lab" x="330" y="43" style="letter-spacing:1.5px">BONNE HUMEUR &amp; JOIE</text><text class="s" x="292" y="82" font-size="12.5" fill="#c2b0ee">Je garde le sourire et la joie</text><text class="s" x="292" y="101" font-size="12.5" fill="#c2b0ee">de travailler, même quand</text><text class="s" x="292" y="120" font-size="12.5" fill="#c2b0ee">un bug résiste.</text><clipPath id="k2"><rect x="536" y="4" width="260" height="140" rx="12"/></clipPath>
<rect x="536" y="4" width="260" height="140" rx="12" fill="#2a1658"/>
<g clip-path="url(#k2)"><rect x="536" y="4" width="260" height="140" fill="url(#sl)"/><rect class="sweep" x="536" y="4" width="260" height="70" fill="url(#sg)"/></g>
<rect x="536.5" y="4.5" width="259" height="139" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><g transform="translate(558,24)"><path d="M2 26 H9 V19 H16 V12 H23 V5" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 5 H23 V10" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text class="lab" x="596" y="43" style="letter-spacing:1.5px">PERSÉVÉRANCE</text><text class="s" x="558" y="82" font-size="12.5" fill="#c2b0ee">Un bug ne m'arrête pas : je</text><text class="s" x="558" y="101" font-size="12.5" fill="#c2b0ee">teste, je corrige, je</text><text class="s" x="558" y="120" font-size="12.5" fill="#c2b0ee">recommence.</text><clipPath id="kw"><rect x="4" y="152" width="792" height="92" rx="12"/></clipPath>
<rect x="4" y="152" width="792" height="92" rx="12" fill="#2a1658"/>
<g clip-path="url(#kw)"><rect x="4" y="152" width="792" height="92" fill="url(#sl)"/><rect class="sweep" x="4" y="152" width="792" height="70" fill="url(#sg)"/></g>
<rect x="4.5" y="152.5" width="791" height="91" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><rect x="28" y="176" width="8" height="8" fill="#d946ef"/><text class="lab" x="44" y="184">À FOND JUSQU'AU BOUT</text><text class="lab2" x="772" y="184" text-anchor="end">STATUT : EN COURS<tspan class="blink">_</tspan></text><text class="s" x="28" y="212" font-size="15" font-weight="500" fill="#f3eaff">Tant que je n'ai pas fini, je suis à fond.</text><rect x="28" y="224" width="744" height="6" rx="3" fill="#3d2477"/><rect class="grow" x="28" y="224" width="744" height="6" rx="3" fill="#d946ef"/></svg>