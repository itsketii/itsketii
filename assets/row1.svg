<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="Présentation, apprentissage et objectif"><title>Présentation, apprentissage et objectif</title><style>
.lab{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:2px;fill:#c2b0ee}
.lab2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10px;letter-spacing:1.5px;fill:#9885cf}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 7s linear infinite}
@keyframes sw{from{transform:translateY(-70px)}to{transform:translateY(340px)}}
@media (prefers-reduced-motion:reduce){.blink,.sweep{animation:none}}
</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="1" fill="#000" fill-opacity=".16"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d946ef" stop-opacity="0"/><stop offset=".5" stop-color="#d946ef" stop-opacity=".10"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></linearGradient>
</defs><clipPath id="c1"><rect x="4" y="4" width="516" height="332" rx="12"/></clipPath>
<rect x="4" y="4" width="516" height="332" rx="12" fill="#2a1658"/>
<g clip-path="url(#c1)"><rect x="4" y="4" width="516" height="332" fill="url(#sl)"/><rect class="sweep" x="4" y="4" width="516" height="70" fill="url(#sg)"/></g>
<rect x="4.5" y="4.5" width="515" height="331" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><rect x="28" y="28" width="38" height="38" fill="#fff"/><text class="m" x="47" y="53" text-anchor="middle" font-size="16" font-weight="700" fill="#111">KK</text><text class="s" x="78" y="44" font-size="14" font-weight="500" fill="#f3eaff">Kouadio Ketsia</text><text class="s" x="78" y="62" font-size="13" fill="#c2b0ee">Développeuse Full-Stack</text><text class="lab" x="480" y="44" text-anchor="end">GRAND-BASSAM, CI</text><circle class="blink" cx="492" cy="40" r="3.5" fill="#d946ef"/><text class="s" x="28" y="108" font-size="22" font-weight="500" fill="#f3eaff">Étudiante en L2 Informatique et Génie</text><text class="s" x="28" y="138" font-size="22" font-weight="500" fill="#f3eaff">Logiciel, je conçois des applications</text><text class="s" x="28" y="168" font-size="22" font-weight="500" fill="#f3eaff">web et des bases de données, de la</text><text class="s" x="28" y="198" font-size="22" font-weight="500" fill="#f3eaff">modélisation jusqu'à l'interface.</text><text class="s" x="28" y="238" font-size="12" fill="#c2b0ee">J'ai commencé par apprendre à construire des projets de bout en bout :</text><text class="s" x="28" y="256" font-size="12" fill="#c2b0ee">base de données, logique métier en Python et C#, interface. J'aime</text><text class="s" x="28" y="274" font-size="12" fill="#c2b0ee">comprendre le besoin avant d'écrire la première ligne de code.</text><text class="s" x="28" y="292" font-size="12" fill="#c2b0ee">J'approfondis Django et le data engineering pour devenir</text><text class="s" x="28" y="310" font-size="12" fill="#c2b0ee">développeuse full stack.</text><g transform="translate(524,0)"><clipPath id="c2"><rect x="4" y="4" width="268" height="162" rx="12"/></clipPath>
<rect x="4" y="4" width="268" height="162" rx="12" fill="#2a1658"/>
<g clip-path="url(#c2)"><rect x="4" y="4" width="268" height="162" fill="url(#sl)"/><rect class="sweep" x="4" y="4" width="268" height="70" fill="url(#sg)"/></g>
<rect x="4.5" y="4.5" width="267" height="161" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><rect x="24" y="26" width="8" height="8" fill="#d946ef"/><text class="lab" x="40" y="34">EN APPRENTISSAGE</text><rect x="24" y="52" width="36" height="26" rx="6" fill="#3d2477" stroke="#7a60c9" stroke-opacity=".45"/><text class="m" x="32" y="69" font-size="11" fill="#f3eaff">SQL</text><rect x="66" y="52" width="57" height="26" rx="6" fill="#3d2477" stroke="#7a60c9" stroke-opacity=".45"/><text class="m" x="74" y="69" font-size="11" fill="#f3eaff">Django</text><rect x="129" y="52" width="43" height="26" rx="6" fill="#3d2477" stroke="#7a60c9" stroke-opacity=".45"/><text class="m" x="137" y="69" font-size="11" fill="#f3eaff">Odoo</text><rect x="178" y="52" width="57" height="26" rx="6" fill="#3d2477" stroke="#7a60c9" stroke-opacity=".45"/><text class="m" x="186" y="69" font-size="11" fill="#f3eaff">Docker</text><rect x="24" y="86" width="125" height="26" rx="6" fill="#3d2477" stroke="#7a60c9" stroke-opacity=".45"/><text class="m" x="32" y="103" font-size="11" fill="#f3eaff">Bases de données</text><rect x="155" y="86" width="84" height="26" rx="6" fill="#3d2477" stroke="#7a60c9" stroke-opacity=".45"/><text class="m" x="163" y="103" font-size="11" fill="#f3eaff">Git/GitHub</text><clipPath id="c3"><rect x="4" y="174" width="268" height="162" rx="12"/></clipPath>
<rect x="4" y="174" width="268" height="162" rx="12" fill="#2a1658"/>
<g clip-path="url(#c3)"><rect x="4" y="174" width="268" height="162" fill="url(#sl)"/><rect class="sweep" x="4" y="174" width="268" height="70" fill="url(#sg)"/></g>
<rect x="4.5" y="174.5" width="267" height="161" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><rect x="24" y="196" width="8" height="8" fill="#d946ef"/><text class="lab" x="40" y="204">OBJECTIF</text><text class="s" x="24" y="260" font-size="26" font-weight="600" fill="#f3eaff">Data engineer<tspan class="blink" fill="#d946ef">_</tspan></text><text class="s" x="24" y="288" font-size="12" fill="#c2b0ee">Objectif : obtenir mon diplôme.</text></g></svg>