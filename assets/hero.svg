<svg xmlns="http://www.w3.org/2000/svg" width="524" height="340" viewBox="0 0 524 340" role="img" aria-label="Kouadio Ketsia, développeuse full-stack" xmlns:c2pa="http://c2pa.org/manifest"><title>Kouadio Ketsia, développeuse full-stack</title><style>
.lab{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:2px;fill:#c2b0ee}
.lab2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10px;letter-spacing:1.5px;fill:#9885cf}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sweep{animation:sw 7s linear infinite}
@keyframes sw{from{transform:translateY(-70px)}to{transform:translateY(340px)}}
@media (prefers-reduced-motion:reduce){.blink,.sweep{animation:none}}
</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="1" fill="#000" fill-opacity=".16"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d946ef" stop-opacity="0"/><stop offset=".5" stop-color="#d946ef" stop-opacity=".10"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></linearGradient>
</defs><clipPath id="c1"><rect x="4" y="4" width="516" height="332" rx="12"/></clipPath>
<rect x="4" y="4" width="516" height="332" rx="12" fill="#2a1658"/>
<g clip-path="url(#c1)"><rect x="4" y="4" width="516" height="332" fill="url(#sl)"/><rect class="sweep" x="4" y="4" width="516" height="70" fill="url(#sg)"/></g>
<rect x="4.5" y="4.5" width="515" height="331" rx="12" fill="none" stroke="#7a60c9" stroke-opacity=".5"/><rect x="28" y="28" width="38" height="38" fill="#fff"/><text class="m" x="47" y="53" text-anchor="middle" font-size="16" font-weight="700" fill="#111">KK</text><text class="s" x="78" y="44" font-size="14" font-weight="500" fill="#f3eaff">Kouadio Ketsia</text><text class="s" x="78" y="62" font-size="13" fill="#c2b0ee">Développeuse Full-Stack</text><text class="lab" x="480" y="44" text-anchor="end">GRAND-BASSAM, CI</text><circle class="blink" cx="492" cy="40" r="3.5" fill="#d946ef"/><text class="s" x="28" y="108" font-size="22" font-weight="500" fill="#f3eaff">Étudiante en L2 Informatique et Génie</text><text class="s" x="28" y="138" font-size="22" font-weight="500" fill="#f3eaff">Logiciel, je conçois des applications</text><text class="s" x="28" y="168" font-size="22" font-weight="500" fill="#f3eaff">web et des bases de données, de la</text><text class="s" x="28" y="198" font-size="22" font-weight="500" fill="#f3eaff">modélisation jusqu'à l'interface.</text><text class="s" x="28" y="238" font-size="12" fill="#c2b0ee">J'ai commencé par apprendre à construire des projets de bout en bout :</text><text class="s" x="28" y="256" font-size="12" fill="#c2b0ee">base de données, logique métier en Python et C#, interface. J'aime</text><text class="s" x="28" y="274" font-size="12" fill="#c2b0ee">comprendre le besoin avant d'écrire la première ligne de code.</text><text class="s" x="28" y="292" font-size="12" fill="#c2b0ee">J'approfondis Django et le data engineering pour devenir</text><text class="s" x="28" y="310" font-size="12" fill="#c2b0ee">développeuse full stack.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>